name: Document or tool defect
description: Report a reproducible linting, formatting, or execution problem
labels: ["Type: Bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: Version and command
      description: Include tool version, Node.js version, operating system, and exact command.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal Markdown input
      description: Use a synthetic or public example. Do not include private vault documents.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration and plugins
      render: json
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output or diagnostics
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected output and rendering difference
    validations:
      required: true
