name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact beta version in package.json (without a v prefix)
        required: true
        default: 0.1.0-beta.1
      publish:
        description: Publish to npm and create a GitHub prerelease (requires separate authorization)
        type: boolean
        default: false
      attribution:
        description: Publishing agent identity, model via harness (required when publishing)
        required: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.match(pkg.version, /^\d+\.\d+\.\d+-beta\.\d+$/);
          assert.equal(pkg.publishConfig.tag, 'beta');
          readFileSync(`docs/releases/${pkg.version}.md`);
          if (process.env.PUBLISH_REQUESTED === 'true') {
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Publish only from main');
            assert.equal(process.env.PUBLISH_ENABLED, 'true', 'Publication is disabled');
          }
          JS
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run release:prepare
      - name: Dry-run the tested tarball
        run:
          npm publish "./artifacts/mdrefine-${EXPECTED_VERSION}.tgz" --dry-run --ignore-scripts
          --access public --tag beta
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      RELEASE_ATTRIBUTION: ${{ inputs.attribution }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release
          path: artifacts
      - name: Check identity, npm support, and unused version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const identity = process.env.RELEASE_ATTRIBUTION;
          assert.match(identity, /^[^\r\n<>]+ via [^\r\n<>]+$/);
          const [major, minor, patch] = execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim().split('.').map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'OIDC requires npm >=11.5.1');
          const version = process.env.EXPECTED_VERSION;
          const response = await fetch(`https://registry.npmjs.org/mdrefine/${version}`);
          assert.equal(response.status, 404, 'Version must be unused; investigate existing publication before retrying');
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/${version}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', 'Release tag already exists');
          writeFileSync('release-notes.md', readFileSync(`docs/releases/${version}.md`, 'utf8') + `\n🤖 Generated with ${identity}\n`);
          JS
      - name: Verify artifact checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested tarball using npm trusted publishing
        run:
          npm publish "./artifacts/mdrefine-${EXPECTED_VERSION}.tgz" --ignore-scripts --access
          public --tag beta --provenance
      - name: Create the GitHub prerelease at this commit
        run: |
          gh release create "$EXPECTED_VERSION" "artifacts/mdrefine-${EXPECTED_VERSION}.tgz" artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" --title "mdrefine $EXPECTED_VERSION" \
            --prerelease --latest=false --notes-file release-notes.md
