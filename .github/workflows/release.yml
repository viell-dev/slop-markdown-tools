name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in package.json (without a v prefix)
        required: true
        default: 0.4.0
      publish:
        description: Publish to npm and create a GitHub release (see RELEASING.md)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  # A release is made from the exact commit of this run, so CI must have passed on that commit:
  # every check that the ruleset for main requires, and unit coverage.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Require CI of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-evidence.mjs "$GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
  # The real renderers, compared before and after formatting at this commit: GitHub's through
  # its Markdown API, and Obsidian's in Docker. Their reports are the runs' artifacts. A release
  # compares only fixed documents, GitHub's fixed seeds and Obsidian's fixtures, so that its
  # result depends only on the commit and the renderers; the random documents of the pull
  # request runs look for new differences, which get issues.
  rendering:
    uses: ./.github/workflows/rendering.yml
    with:
      seed: none
  obsidian:
    uses: ./.github/workflows/obsidian.yml
    with:
      count: "0"
  prepare:
    needs: [ci, rendering, obsidian]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Validate release metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          // A stable version is published as latest; a prerelease under the channel
          // named by its identifier, beta or rc, which leaves latest alone.
          const match = /^\d+\.\d+\.\d+(?:-(beta|rc)\.\d+)?$/.exec(pkg.version);
          assert(match, 'Version must be stable, or a beta or rc prerelease');
          assert.equal(pkg.publishConfig.tag, match[1] ?? 'latest');
          // The release notes are the version's section of CHANGELOG.md; the script fails without one.
          execFileSync(process.execPath, ['scripts/release-notes.mjs', pkg.version], { stdio: ['ignore', 'ignore', 'inherit'] });
          const publishing = process.env.PUBLISH_REQUESTED === 'true';
          if (publishing) {
            assert.equal(process.env.GITHUB_REF, 'refs/heads/main', 'Publish only from main');
            assert.equal(process.env.PUBLISH_ENABLED, 'true', 'Publication is disabled');
          }
          // A published version or an existing tag is never published again. Publication stops
          // here, before anything is built; a dry run only reports it. The publish job checks
          // once more right before it publishes.
          const registry = (await fetch(`https://registry.npmjs.org/mdrefine/${pkg.version}`)).status;
          const tag = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/${pkg.version}`], { encoding: 'utf8' }).trim();
          const problems = [];
          if (registry !== 404) problems.push(registry === 200 ? 'is already on npm' : `could not be looked up on npm (HTTP ${registry})`);
          if (tag) problems.push('already has a tag');
          for (const problem of problems) {
            const message = `mdrefine ${pkg.version} ${problem}`;
            if (publishing) assert.fail(`${message}; investigate the existing publication before releasing`);
            console.log(`::warning::${message}; a run that publishes would stop here.`);
          }
          JS
      - run: npm ci
      # Only the dependencies that the package installs; CI audits the development tools too.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run release:prepare
      - name: Dry-run the tested tarball
        run: |
          npm publish "./artifacts/mdrefine-${EXPECTED_VERSION}.tgz" --dry-run --ignore-scripts \
            --access public --tag "$(node -p "require('./package.json').publishConfig.tag")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  # Runs after the publish job below. A separate job without write permissions, so that
  # re-running it after a failure checks the registry again without publishing again.
  verify-publication:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: artifacts
      - name: Compare the registry's checksums and provenance with the tested tarball
        run: |
          node scripts/verify-publication.mjs "$EXPECTED_VERSION" \
            "artifacts/mdrefine-${EXPECTED_VERSION}.tgz" "$GITHUB_SHA"
  publish:
    if: inputs.publish && vars.NPM_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: artifacts
      - name: Check npm support and unused version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const [major, minor, patch] = execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim().split('.').map(Number);
          assert(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))), 'OIDC requires npm >=11.5.1');
          const version = process.env.EXPECTED_VERSION;
          const response = await fetch(`https://registry.npmjs.org/mdrefine/${version}`);
          assert.equal(response.status, 404, 'Version must be unused; investigate existing publication before retrying');
          const tags = execFileSync('git', ['ls-remote', '--tags', 'origin', `refs/tags/${version}`], {encoding: 'utf8'});
          assert.equal(tags.trim(), '', 'Release tag already exists');
          const notes = execFileSync(process.execPath, ['scripts/release-notes.mjs', version], {encoding: 'utf8'});
          writeFileSync('release-notes.md', notes);
          JS
      - name: Verify artifact checksum
        working-directory: artifacts
        run: sha256sum --check SHA256SUMS
      - name: Publish the tested tarball using npm trusted publishing
        run: |
          # The dist-tag that the prepare job checked: latest, or the prerelease channel.
          npm publish "./artifacts/mdrefine-${EXPECTED_VERSION}.tgz" --ignore-scripts --access \
            public --tag "$(node -p "require('./package.json').publishConfig.tag")" --provenance
      - name: Create the GitHub release at this commit
        run: |
          # A stable version becomes the latest release; a prerelease is marked as one.
          case "$EXPECTED_VERSION" in
            *-*) kind=(--prerelease --latest=false) ;;
            *) kind=(--latest) ;;
          esac
          gh release create "$EXPECTED_VERSION" "artifacts/mdrefine-${EXPECTED_VERSION}.tgz" artifacts/SHA256SUMS \
            --target "$GITHUB_SHA" --title "mdrefine $EXPECTED_VERSION" \
            "${kind[@]}" --notes-file release-notes.md
