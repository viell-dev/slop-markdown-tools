name: Obsidian
# Formats the documents of scripts/obsidian/fixtures.mjs and generated documents in the Obsidian
# dialect and compares what Obsidian's Live Preview and Reading view show before and after, with
# Obsidian running in Docker (scripts/obsidian-check.mjs). It runs for pull requests that change
# how documents are read or formatted, by hand, from the Release workflow for the commit that it
# releases, with realistic fixed-seed documents and the fixtures. Weekly/manual adversarial
# discovery reports new differences separately. report.json and screenshots of the first
# differences are in the run's obsidian artifact. Native PR routing is in native.yml.
on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:
    inputs:
      profile:
        description: Realistic regression gate or adversarial discovery
        type: choice
        options: [adversarial, realistic]
        default: adversarial
      seed:
        description: Seed or none; adversarial is random when empty, realistic uses fixed seeds
        required: false
      count:
        description: Documents per seed (realistic 10, adversarial 100 when empty)
        required: false
      obsidian-version:
        description: App version for deliberate drift checks
        required: false
        default: latest
      obsidian-installer-version:
        description: Installer version for deliberate drift checks
        required: false
        default: latest
  workflow_call:
    inputs:
      profile:
        type: string
        default: realistic
      seed:
        type: string
        required: false
      count:
        type: string
        required: false
      obsidian-version:
        type: string
        required: false
      obsidian-installer-version:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # In a run that the Release workflow calls, github.workflow is "Release", so a release never
  # waits for, or is replaced by, a weekly or manual run.
  group: obsidian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compare:
    name: Obsidian rendering
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compare
        env:
          PROFILE:
            ${{ github.event_name == 'schedule' && 'adversarial' || inputs.profile || 'realistic' }}
          SEED: ${{ inputs.seed }}
          COUNT: ${{ inputs.count }}
          OBSIDIAN_VERSION:
            ${{ github.event_name == 'schedule' && 'latest' || inputs.obsidian-version }}
          OBSIDIAN_INSTALLER_VERSION:
            ${{ github.event_name == 'schedule' && 'latest' || inputs.obsidian-installer-version }}
        run: npm run check:obsidian
      - name: Validate deterministic gate evidence
        if: ${{ github.event_name == 'pull_request' || github.workflow == 'Release' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { validateRendererEvidence } from './scripts/renderer-evidence.mjs';
          validateRendererEvidence(JSON.parse(readFileSync('artifacts/obsidian/report.json', 'utf8')), 'obsidian');
          JS
      # Fails too when the check compared nothing, so that a run that skipped its work cannot
      # pass for one that found no difference.
      - if: ${{ !cancelled() }}
        name: Summarize
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_STEP_SUMMARY"
          import { existsSync, readFileSync } from 'node:fs';
          const file = 'artifacts/obsidian/report.json';
          if (!existsSync(file)) {
            console.log('The check wrote no report.');
            process.exit(1);
          }
          const report = JSON.parse(readFileSync(file, 'utf8'));
          console.log(`## Obsidian ${report.obsidian}, before and after formatting\n`);
          console.log(`Installer ${report.identity?.installer}, Electron ${report.identity?.electron}, Chrome ${report.identity?.chrome}; image ${report.identity?.image?.id}, declared base ${report.identity?.image?.declaredBase}.\n`);
          console.log(`Profile **${report.profile}**, seeds **${report.seeds.join(',')}**, ${report.count} documents per seed and the fixtures, at widths ${report.widths.join(' and ')}: ${report.compared} compared, ${report.unexpected.length} new view differences, ${report.known.length} known, ${report.stale.length} stale.`);
          console.log(`\nRepeat with \`PROFILE=${report.profile} SEEDS=${report.seeds.join(',')} SEED=none COUNT=${report.count} OBSIDIAN_VERSION=${report.obsidian} OBSIDIAN_INSTALLER_VERSION=${report.identity?.installer} npm run check:obsidian\`.`);
          if (!(report.compared > 0)) process.exit(1);
          JS
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: obsidian
          path: artifacts/obsidian/
          if-no-files-found: warn
          retention-days: 14
