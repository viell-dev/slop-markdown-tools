name: Rendering
# Formats generated documents and compares GitHub's rendering of each before and after, through
# GitHub's Markdown API (scripts/github-rendering.mjs, issue #303). It runs every week, so that a
# change of GitHub's renderer shows up, for pull requests that change how documents are read or
# formatted, by hand, and from the Release workflow for the commit that it releases. A run makes
# up to 600 requests, and a workflow's token may make 1,000 an hour in this repository, so when
# runs overlap, the script waits for the limit to reset. A difference fails the run; the
# report, the documents, and their HTML are in the run's rendering artifact, and the summary
# names the run's new seed, which reproduces it. The paths below are the Obsidian workflow's,
# with this check's own files; keep the two lists alike.
on:
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - src/config/**
      - src/core/**
      - src/rules/**
      - src/syntax/**
      - src/index.ts
      - package.json
      - package-lock.json
      - scripts/build-parser.mjs
      - scripts/parser-patches.mjs
      - scripts/parser-packages.json
      - scripts/rendering.mjs
      - scripts/github-rendering.mjs
      - .github/workflows/rendering.yml
  workflow_dispatch:
    inputs:
      seed:
        description: The new seed (a whole number below 2^32, or none); random when empty
        required: false
  workflow_call:
    inputs:
      seed:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  # In a run that the Release workflow calls, github.workflow is "Release", so a release never
  # waits for, or is replaced by, a weekly or manual run.
  group: rendering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Compare
        # An explicit shell enables pipefail, so a difference fails the step.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ inputs.seed }}
        run: |
          arguments=()
          if [ -n "$SEED" ]; then arguments+=(--seed "$SEED"); fi
          mkdir -p artifacts
          node scripts/github-rendering.mjs "${arguments[@]}" | tee artifacts/github-rendering.md \
            >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendering
          path: |
            artifacts/github-rendering.md
            artifacts/github-rendering/
          if-no-files-found: warn
          retention-days: 14
