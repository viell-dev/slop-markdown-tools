name: Benchmark
# Timings from a GitHub-hosted runner are the reference results in docs/benchmarks.md.
# The job never fails on a slow result; it only reports.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - benchmarks/**
      - .github/workflows/benchmark.yml
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Measure
        # An explicit shell enables pipefail, so a failed run fails the step.
        shell: bash
        run: node benchmarks/run.mjs | tee benchmark.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark
          path: benchmark.md
          if-no-files-found: error
