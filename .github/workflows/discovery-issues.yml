name: Report discovery failures
# workflow_run uses the default branch's trusted reporter, never PR code. The source
# event guard deliberately excludes manual, PR, and reusable release runs.
on:
  workflow_run:
    workflows: [Rendering, Obsidian, Forges]
    types: [completed]
permissions: {}
concurrency:
  group: discovery-issue-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  report:
    if:
      ${{ github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion ==
      'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/discovery-issue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Download report data
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name:
            ${{ github.event.workflow_run.name == 'Rendering' && 'rendering' ||
            github.event.workflow_run.name == 'Obsidian' && 'obsidian' || 'forges' }}
          path: discovery
      - name: Prepare issue without credentials
        run: node scripts/discovery-issue.mjs prepare
      - name: Publish once per run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/discovery-issue.mjs publish
