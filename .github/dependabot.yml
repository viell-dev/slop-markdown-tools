version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    # A version becomes a candidate a week after its publication, which leaves
    # time for a compromised or broken release to be found and withdrawn.
    cooldown:
      default-days: 7
    ignore:
      # Revisit when typescript-eslint supports TypeScript 7; see PR #3.
      - dependency-name: typescript
        versions: ["7.x"]
      # The type definitions follow the lowest supported Node.js version, 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # PRs #591-#594: these lines require the next reference-parser generation.
      # VitePress alpha.20 uses markdown-it 14 / mathjax3 4. Compatible older
      # lines remain eligible. Revisit when compatible peer ranges return,
      # with a reference upgrade, or when a security advisory requires it.
      - dependency-name: markdown-it-mathjax3
        versions: [">=5.0.0 <6.0.0"]
      - dependency-name: markdown-it
        versions: [">=15.0.0 <16.0.0"]
      - dependency-name: "@mdit/plugin-attrs"
        versions: [">=1.3.0 <2.0.0"]
      - dependency-name: "@mdit/plugin-footnote"
        versions: [">=1.1.0 <2.0.0"]
    groups:
      development:
        dependency-type: development
  # The Obsidian check (scripts/obsidian-check.mjs) keeps its own dependencies and image.
  - package-ecosystem: npm
    directory: /scripts/obsidian
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # wdio-obsidian-service 3.3 needs WebdriverIO 9.
      - dependency-name: "webdriverio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wdio/*"
        update-types: ["version-update:semver-major"]
    groups:
      obsidian-check:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /scripts/obsidian
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image follows Node.js's long-term support releases, whose majors are
      # even and come by hand; Dependabot would offer odd ones, such as 25.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
