version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: ["Type: Maintenance", "Status: Needs Triage"]
    schedule:
      interval: weekly
    # Revisit when typescript-eslint supports TypeScript 7; see PR #3.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    labels: ["Type: Maintenance", "Status: Needs Triage"]
    schedule:
      interval: weekly
