version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    # A version becomes a candidate a week after its publication, which leaves
    # time for a compromised or broken release to be found and withdrawn.
    cooldown:
      default-days: 7
    ignore:
      # Revisit when typescript-eslint supports TypeScript 7; see PR #3.
      - dependency-name: typescript
        versions: ["7.x"]
      # The type definitions follow the lowest supported Node.js version, 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
