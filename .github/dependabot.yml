version: 2
updates:
  - package-ecosystem: npm
    directory: /
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    # A version becomes a candidate a week after its publication, which leaves
    # time for a compromised or broken release to be found and withdrawn.
    cooldown:
      default-days: 7
    ignore:
      # Revisit when typescript-eslint supports TypeScript 7; see PR #3.
      - dependency-name: typescript
        versions: ["7.x"]
      # The type definitions follow the lowest supported Node.js version, 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # PR #591: VitePress alpha.20 peers mathjax3 ^4; v5 changes its backend.
      # The deferred mdit plugin lines below peer markdown-it 15, while the
      # current VitePress reading uses 14. See CONTRIBUTING's dependency procedure.
      # PRs #592-#594, #608, #610 and #611; compatible older lines remain eligible.
      # Revisit when compatible peer ranges return, with a reference upgrade,
      # or when a security advisory requires it.
      - dependency-name: markdown-it-mathjax3
        versions: [">=5.0.0 <6.0.0"]
      - dependency-name: markdown-it
        versions: [">=15.0.0 <16.0.0"]
      - dependency-name: "@mdit/plugin-attrs"
        versions: [">=1.3.0 <2.0.0"]
      - dependency-name: "@mdit/plugin-container"
        versions: [">=2.0.0 <3.0.0"]
      - dependency-name: "@mdit/plugin-emoji"
        versions: [">=1.2.0 <2.0.0"]
      - dependency-name: "@mdit/plugin-footnote"
        versions: [">=1.1.0 <2.0.0"]
      - dependency-name: "@mdit/plugin-tasklist"
        versions: [">=1.1.0 <2.0.0"]
    groups:
      # Names follow maintenance responsibilities across dependency fields.
      # Routine groups exclude majors; prereleases and peer-breaking minors
      # still require deliberate compatibility review, not just a group match.
      parser:
        patterns:
          - "micromark*"
          - "mdast-util-from-markdown"
          - "mdast-util-frontmatter"
          - "mdast-util-gfm*"
          - "mdast-util-math"
          - "@types/mdast"
          - "@types/unist"
          - "decode-named-character-reference"
        update-types: ["minor", "patch"]
      vitepress:
        patterns: ["vitepress", "markdown-it*", "@mdit/*", "@mdit-vue/*"]
        update-types: ["minor", "patch"]
      references:
        patterns: ["commonmark", "@types/commonmark", "mdast-util-to-hast", "hast-util-to-html"]
        update-types: ["minor", "patch"]
      # Keep specific groups first. These exclusions also leave otherwise
      # ungrouped tree inputs and the compiler/bundler individually proposed.
      tools:
        dependency-type: development
        exclude-patterns:
          - "micromark*"
          - "mdast-util-*"
          - "@types/mdast"
          - "@types/unist"
          - "decode-named-character-reference"
          - "vitepress"
          - "markdown-it*"
          - "@mdit/*"
          - "@mdit-vue/*"
          - "commonmark"
          - "@types/commonmark"
          - "hast-util-to-html"
          - "rolldown"
          - "typescript"
        update-types: ["minor", "patch"]
  # The Obsidian check (scripts/obsidian-check.mjs) keeps its own dependencies and image.
  - package-ecosystem: npm
    directory: /scripts/obsidian
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # wdio-obsidian-service 3.3 needs WebdriverIO 9.
      - dependency-name: "webdriverio"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@wdio/*"
        update-types: ["version-update:semver-major"]
    groups:
      obsidian-check:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /scripts/obsidian
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image follows Node.js's long-term support releases, whose majors are
      # even and come by hand; Dependabot would offer odd ones, such as 25.
      # Patch/digest proposals remain enabled; complete the verified FROM/label/
      # baseline update in CONTRIBUTING before merging a one-field proposal.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    labels: ["Type: Maintenance"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
